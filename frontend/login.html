<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Claim Fraud Detection - Login</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #1e3c72,
                    #2a5298
                );
        }

        .login-container {
            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1e3c72;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2a5298;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1e3c72;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;

            text-align: center;

            font-size: 12px;

            color: #777;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>
        Insurance Fraud Detection
    </h1>

    <div class="subtitle">
        Secure User Login
    </div>


    <form id="loginForm">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div id="message"></div>


    <div class="footer">

        Insurance Claim Processing and
        Fraud Insight Platform

    </div>

</div>


<script>

const API_BASE = "http://127.0.0.1:8000";


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const message =
            document.getElementById("message");


        message.style.color = "black";

        message.innerText = "Logging in...";


        try {

            /*
             * FastAPI OAuth2PasswordRequestForm
             * requires application/x-www-form-urlencoded
             */

            const formData =
                new URLSearchParams();


            formData.append(
                "username",
                username
            );


            formData.append(
                "password",
                password
            );


            const response =
                await fetch(
                    `${API_BASE}/login`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Login failed"
                );

            }


            /*
             * IMPORTANT:
             *
             * api.py returns:
             *
             * data.user.username
             * data.user.role
             * data.user.customer_id
             */

            if (!data.access_token) {

                throw new Error(
                    "Login succeeded but no access token was received."
                );

            }


            const user =
                data.user;


            /*
             * Store JWT
             */

            localStorage.setItem(
                "access_token",
                data.access_token
            );


            /*
             * Store username
             */

            localStorage.setItem(
                "username",
                user.username
            );


            /*
             * Store role
             */

            localStorage.setItem(
                "role",
                user.role
            );


            /*
             * Store customer ID
             * if this is a customer.
             */

            if (
                user.customer_id !== null &&
                user.customer_id !== undefined
            ) {

                localStorage.setItem(
                    "customer_id",
                    user.customer_id
                );

            } else {

                localStorage.removeItem(
                    "customer_id"
                );

            }


            message.style.color = "green";

            message.innerText =
                "Login successful! Redirecting...";


            /*
             * Redirect to dashboard.
             */

            setTimeout(function() {

                window.location.href =
                    "/frontend/dashboard.html";

            }, 500);


        } catch (error) {

            message.style.color = "red";

            message.innerText =
                "Error: " +
                error.message;

        }

    });

</script>


</body>

</html>
