<script>

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    function decodeJwt(token) {

        try {

            const parts = token.split(".");

            if (parts.length !== 3) {
                return null;
            }

            const base64 = parts[1]
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            const jsonPayload = decodeURIComponent(
                atob(base64)
                    .split("")
                    .map(function(character) {
                        return "%" +
                            ("00" + character.charCodeAt(0).toString(16))
                            .slice(-2);
                    })
                    .join("")
            );

            return JSON.parse(jsonPayload);

        } catch (error) {

            console.error("JWT decode error:", error);

            return null;
        }
    }


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        if (!username || !password) {

            message.textContent = "Please enter username and password.";
            message.className = "error";

            return;
        }


        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        message.textContent = "";
        message.className = "";


        try {

            /*
             * IMPORTANT:
             * We use a relative URL here.
             *
             * The login page is served by the API Gateway:
             * http://127.0.0.1:8000/frontend/login.html
             *
             * Therefore this request goes to:
             * http://127.0.0.1:8000/auth/login
             */
            const response = await fetch("http://127.0.0.1:8000/auth/login", {

    method: "POST",

    headers: {
        "Content-Type": "application/json"
    },

    body: JSON.stringify({
        username: username,
        password: password
    })
});


const responseText = await response.text();

console.log("Login HTTP status:", response.status);
console.log("Login response:", responseText);


let data = {};

if (responseText.trim() !== "") {

    try {
        data = JSON.parse(responseText);
    } catch (parseError) {

        throw new Error(
            "Server returned a non-JSON response: " +
            responseText.substring(0, 200)
        );
    }
}


if (!response.ok) {

    throw new Error(
        data.detail ||
        data.message ||
        "Login failed with HTTP " + response.status
    );
}


if (!data.access_token) {

    throw new Error(
        "Login response did not contain an access token."
    );
}


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    data.message ||
                    "Login failed"
                );
            }


            if (!data.access_token) {

                throw new Error(
                    "Login successful, but no access token was returned."
                );
            }


            const token = data.access_token;

            const payload = decodeJwt(token);


            if (!payload) {

                throw new Error(
                    "Invalid authentication token received."
                );
            }


            /*
             * Clear previous session information.
             */
            localStorage.clear();


            /*
             * Store JWT token.
             */
            localStorage.setItem(
                "access_token",
                token
            );


            /*
             * Store user information from JWT.
             */
            localStorage.setItem(
                "username",
                payload.username || username
            );

            localStorage.setItem(
                "role",
                payload.role || ""
            );


            if (payload.customer_id !== null &&
                payload.customer_id !== undefined) {

                localStorage.setItem(
                    "customer_id",
                    payload.customer_id
                );
            }


            message.textContent = "Login successful. Redirecting...";
            message.className = "success";


            /*
             * Redirect to dashboard.
             */
            setTimeout(function() {

                window.location.href = "/frontend/dashboard.html";

            }, 500);


        } catch (error) {

            console.error("Login error:", error);

            message.textContent =
                "Error: " + error.message;

            message.className = "error";

            loginButton.disabled = false;
            loginButton.textContent = "Login";
        }

    });

</script>
