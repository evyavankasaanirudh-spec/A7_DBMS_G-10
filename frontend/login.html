<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Fraud Detection - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #050b14;
            --card: rgba(15, 23, 42, 0.94);
            --border: rgba(148, 163, 184, 0.16);

            --text: #e5e7eb;
            --muted: #94a3b8;

            --blue: #3b82f6;
            --blue-dark: #2563eb;
            --cyan: #06b6d4;

            --red: #f87171;
            --green: #4ade80;
        }

        /* =====================================================
           PAGE
           ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59, 130, 246, 0.16),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(6, 182, 212, 0.10),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #030712,
                    #07111f 50%,
                    #0a1424
                );
        }


        /* =====================================================
           AMBIENT LIGHT
           ===================================================== */

        body::before {
            content: "";

            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            right: -120px;

            border-radius: 50%;

            background:
                rgba(59, 130, 246, 0.08);

            filter: blur(70px);

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 360px;
            height: 360px;

            bottom: -180px;
            left: -100px;

            border-radius: 50%;

            background:
                rgba(6, 182, 212, 0.06);

            filter: blur(70px);

            pointer-events: none;
        }


        /* =====================================================
           LOGIN CARD
           ===================================================== */

        .login-container {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 440px;

            padding: 42px 40px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 24, 39, 0.96),
                    rgba(15, 23, 42, 0.90)
                );

            border:
                1px solid var(--border);

            border-radius: 20px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.48);

            backdrop-filter: blur(20px);
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo {
            width: 64px;
            height: 64px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(59, 130, 246, 0.20),
                    rgba(6, 182, 212, 0.10)
                );

            border:
                1px solid rgba(59, 130, 246, 0.28);

            box-shadow:
                0 12px 35px
                rgba(37, 99, 235, 0.18);
        }


        .logo-icon {
            width: 21px;
            height: 21px;

            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #38bdf8
                );

            transform: rotate(45deg);

            box-shadow:
                0 5px 18px
                rgba(59, 130, 246, 0.35);
        }


        /* =====================================================
           TITLE
           ===================================================== */

        .login-container h1 {
            margin:
                0 0 8px;

            text-align: center;

            color: #f8fafc;

            font-size: 28px;

            font-weight: 800;

            letter-spacing: -0.7px;
        }


        .subtitle {
            margin:
                0 0 30px;

            text-align: center;

            color: var(--muted);

            font-size: 14px;
        }


        /* =====================================================
           FORM
           ===================================================== */

        #loginForm {
            width: 100%;
        }


        #loginForm label {
            display: block;

            width: 100%;

            margin:
                0 0 8px;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 650;
        }


        #loginForm input {
            display: block;

            width: 100%;

            margin:
                0 0 19px;

            padding:
                13px 14px;

            border:
                1px solid rgba(148, 163, 184, 0.18);

            border-radius: 9px;

            background:
                rgba(5, 13, 25, 0.78);

            color: #f8fafc;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        #loginForm input::placeholder {
            color: #64748b;
        }


        #loginForm input:hover {
            border-color:
                rgba(148, 163, 184, 0.28);
        }


        #loginForm input:focus {
            background:
                rgba(5, 13, 25, 0.95);

            border-color:
                rgba(59, 130, 246, 0.70);

            box-shadow:
                0 0 0 3px
                rgba(59, 130, 246, 0.10);
        }


        /* =====================================================
           LOGIN BUTTON
           ===================================================== */

        #loginButton {
            display: block;

            width: 100%;

            margin-top: 7px;

            padding:
                13px 16px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-dark)
                );

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 8px 24px
                rgba(37, 99, 235, 0.22);

            transition:
                all 0.2s ease;
        }


        #loginButton:hover {
            transform:
                translateY(-1px);

            box-shadow:
                0 12px 30px
                rgba(37, 99, 235, 0.35);
        }


        #loginButton:active {
            transform:
                translateY(0);
        }


        #loginButton:disabled {
            opacity: 0.65;

            cursor:
                not-allowed;

            transform:
                none;
        }


        /* =====================================================
           MESSAGE
           ===================================================== */

        #message {
            min-height: 20px;

            margin-top: 16px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }


        #message.error {
            padding:
                10px 12px;

            border-radius: 8px;

            background:
                rgba(239, 68, 68, 0.08);

            border:
                1px solid rgba(239, 68, 68, 0.18);

            color:
                var(--red);
        }


        #message.success {
            padding:
                10px 12px;

            border-radius: 8px;

            background:
                rgba(34, 197, 94, 0.08);

            border:
                1px solid rgba(34, 197, 94, 0.18);

            color:
                var(--green);
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {
            margin-top: 25px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(148, 163, 184, 0.10);

            text-align: center;

            color: #64748b;

            font-size: 11px;

            line-height: 1.6;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 520px) {

            body {
                padding: 16px;
            }


            .login-container {
                padding:
                    34px 24px;

                border-radius:
                    16px;
            }


            .login-container h1 {
                font-size:
                    23px;
            }


            .logo {
                width: 58px;
                height: 58px;
            }
        }
    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            <div class="logo-icon"></div>
        </div>


        <h1>
            Insurance Fraud Detection
        </h1>


        <div class="subtitle">
            Secure User Login
        </div>


        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>


        <div id="message"></div>


        <div class="footer">
            Insurance Claim Processing and Fraud Insight Platform
        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const message =
            document.getElementById("message");


        /* =====================================================
           JWT DECODER
           ===================================================== */

        function decodeJwt(token) {

            try {

                const parts =
                    token.split(".");

                if (parts.length !== 3) {
                    return null;
                }


                const base64 =
                    parts[1]
                        .replace(/-/g, "+")
                        .replace(/_/g, "/");


                const jsonPayload =
                    decodeURIComponent(
                        atob(base64)
                            .split("")
                            .map(function(character) {

                                return "%" +
                                    (
                                        "00" +
                                        character
                                            .charCodeAt(0)
                                            .toString(16)
                                    ).slice(-2);

                            })
                            .join("")
                    );


                return JSON.parse(jsonPayload);

            } catch (error) {

                console.error(
                    "JWT decode error:",
                    error
                );

                return null;
            }
        }


        /* =====================================================
           LOGIN
           ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (!username || !password) {

                    message.textContent =
                        "Please enter username and password.";

                    message.className =
                        "error";

                    return;
                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";

                message.textContent =
                    "";

                message.className =
                    "";


                try {

                    const response =
                        await fetch(
                            "http://127.0.0.1:8000/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        username:
                                            username,

                                        password:
                                            password
                                    })
                            }
                        );


                    const responseText =
                        await response.text();


                    console.log(
                        "Login HTTP status:",
                        response.status
                    );

                    console.log(
                        "Login response:",
                        responseText
                    );


                    let data = {};


                    if (
                        responseText.trim() !== ""
                    ) {

                        try {

                            data =
                                JSON.parse(
                                    responseText
                                );

                        } catch (parseError) {

                            throw new Error(
                                "Server returned a non-JSON response: " +
                                responseText.substring(
                                    0,
                                    200
                                )
                            );
                        }
                    }


                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            data.message ||
                            "Login failed with HTTP " +
                            response.status
                        );
                    }


                    if (!data.access_token) {

                        throw new Error(
                            "Login response did not contain an access token."
                        );
                    }


                    const token =
                        data.access_token;


                    const payload =
                        decodeJwt(token);


                    if (!payload) {

                        throw new Error(
                            "Invalid authentication token received."
                        );
                    }


                    /*
                     * Clear previous session information.
                     */

                    localStorage.clear();


                    /*
                     * Store JWT token.
                     */

                    localStorage.setItem(
                        "access_token",
                        token
                    );


                    /*
                     * Store user information.
                     */

                    localStorage.setItem(
                        "username",
                        payload.username ||
                        username
                    );


                    localStorage.setItem(
                        "role",
                        payload.role || ""
                    );


                    if (
                        payload.customer_id !== null &&
                        payload.customer_id !== undefined
                    ) {

                        localStorage.setItem(
                            "customer_id",
                            payload.customer_id
                        );
                    }


                    message.textContent =
                        "Login successful. Redirecting...";

                    message.className =
                        "success";


                    /*
                     * Redirect to dashboard.
                     */

                    setTimeout(
                        function() {

                            window.location.href =
                                "/frontend/dashboard.html";

                        },
                        500
                    );


                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );


                    message.textContent =
                        "Error: " +
                        error.message;

                    message.className =
                        "error";


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";
                }

            }
        );

    </script>

</body>

</html>
